spring:
  application:
    name: fanlink-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fanlink
    username: fanlink
    password: fanlink

  jpa:
    hibernate:
      # ponytail: ddl-auto=update is fine for a two-person hackathon build; swap to
      # Flyway/Liquibase migrations once the schema needs to survive a prod deploy.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:naver-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-fanlink-secret-key-change-me-before-prod-0123456789}
    expiration-ms: 604800000 # 7 days
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  ocr:
    naver:
      invoke-url: ${NAVER_OCR_INVOKE_URL:}
      secret-key: ${NAVER_OCR_SECRET_KEY:}

server:
  port: 8080
